spring.application.name=demo
server.port=8000

# Chat & General configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# Embedding configuration + Project ID specification
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# Satisfies the project-id requirement for the connection details bean
spring.ai.google.genai.project-id=default