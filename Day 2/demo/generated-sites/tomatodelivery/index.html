<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomatoExpress | Fresh Tomatoes Delivered to Your Door</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TomatoExpress</div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Tomatoes</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Farm Fresh Tomatoes</h1>
        <p>Delivered straight from the vine to your kitchen.</p>
        <button class="cta-button">Order Now</button>
    </section>

    <section id="products">
        <h2>Our Varieties</h2>
        <div class="product-grid">
            <div class="product-card">
                <h3>Roma Tomatoes</h3>
                <p>$3.99 / lb</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Cherry Tomatoes</h3>
                <p>$4.99 / lb</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Heirloom Tomatoes</h3>
                <p>$6.99 / lb</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 TomatoExpress. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
